name: lint-test

on:
  push:
    paths-ignore:
      - README.md
      - doc/**
      - AGENTS.md
      - CLAUDE.md
      - .agents/**
      - .claude
  pull_request:
    paths-ignore:
      - README.md
      - doc/**
      - AGENTS.md
      - CLAUDE.md
      - .agents/**
      - .claude

permissions:
  contents: read

jobs:
  stylua:
    name: stylua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          version: latest
          token: ${{ secrets.GITHUB_TOKEN }}
          args: --color always --check .

  test:
    name: test (${{ matrix.os }}, ${{ matrix.nvim-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        nvim-version: [stable, nightly]
    steps:
      - uses: actions/checkout@v7
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim-version }}
      - uses: extractions/setup-just@v4
      - run: just test
